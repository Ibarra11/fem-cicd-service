name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yaml
  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: build
    # The permissions is scoped to the job, so the build job does not have access to the AWS credentials. This is a security best practice.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::590183989742:role/fem-cicd-service
      - run: aws s3 sync dist/ s3://fem-cicd-service-590183989742-us-east-1-an/ --delete
